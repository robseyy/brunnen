name: Keepalive
on:
  schedule:
    - cron: '0 0 1 * *'   # einmal im Monat, am 1.
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Dummy commit
        run: |
          git config user.name "keepalive-bot"
          git config user.email "actions@github.com"
          date > .keepalive
          git add .keepalive
          git commit -m "keepalive" || echo "nothing to commit"
          git push
