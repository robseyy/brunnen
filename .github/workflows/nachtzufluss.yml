name: Nachtzufluss Berechnung

on:
  schedule:
    - cron: '0 21 * * *'   # 23:00 MESZ (Sommerzeit)
    - cron: '0 3 * * *'    # 05:00 MESZ
  workflow_dispatch:
    inputs:
      mode:
        description: 'snapshot oder calculate'
        required: true
        default: 'snapshot'

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Snapshot um 23 Uhr
        if: github.event.schedule == '0 21 * * *'
        env:
          DATACAKE_TOKEN: ${{ secrets.DATACAKE_TOKEN }}
          DATACAKE_WORKSPACE_ID: ${{ secrets.DATACAKE_WORKSPACE_ID }}
          DATACAKE_DEVICE_ID: ${{ secrets.DATACAKE_DEVICE_ID }}
        run: python nachtzufluss.py snapshot
      - name: Berechnung um 5 Uhr
        if: github.event.schedule == '0 3 * * *'
        env:
          DATACAKE_TOKEN: ${{ secrets.DATACAKE_TOKEN }}
          DATACAKE_WORKSPACE_ID: ${{ secrets.DATACAKE_WORKSPACE_ID }}
          DATACAKE_DEVICE_ID: ${{ secrets.DATACAKE_DEVICE_ID }}
        run: python nachtzufluss.py calculate
      - name: Manueller Test
        if: github.event_name == 'workflow_dispatch'
        env:
          DATACAKE_TOKEN: ${{ secrets.DATACAKE_TOKEN }}
          DATACAKE_WORKSPACE_ID: ${{ secrets.DATACAKE_WORKSPACE_ID }}
          DATACAKE_DEVICE_ID: ${{ secrets.DATACAKE_DEVICE_ID }}
        run: python nachtzufluss.py ${{ github.event.inputs.mode }}
